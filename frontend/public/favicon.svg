<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Terminal Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="24" cy="24" r="20" fill="#3b82f6" opacity="0.12" />

  <!-- Terminal Prompt Chevron ( > ) -->
  <path d="M18 20 L30 32 L18 44" fill="none" stroke="url(#blueGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Underscore / Cursor ( _ ) -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#60a5fa" stroke-width="5.5" stroke-linecap="round" />
</svg>
